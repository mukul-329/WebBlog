name: Code Linting & Test
on:
    push:
        branches: main

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Show directory
              run:  ls -al $GITHUB_WORKSPACE 
            
            - name: Change directory
              run: cd $GITHUB_WORKSPACE/frontend

            - name: Install Module 
              run: yarn --cwd $GITHUB_WORKSPACE/frontend
              
            - name: Run ESLint
              run: eslint ../. --ext .js,.jsx,.ts,.tsx  
